<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 Voice Buddy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C5CE7">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:linear-gradient(135deg,#6C5CE7,#a29bfe);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.card{background:white;width:100%;max-width:420px;border-radius:25px;padding:25px;box-shadow:0 15px 35px rgba(0,0,0,0.2)}
h1{text-align:center;color:#6C5CE7;font-size:24px}
.sub{text-align:center;color:#636e72;font-size:13px;margin-bottom:20px}
label{font-size:13px;font-weight:600;color:#2d3436;margin-top:12px;display:block}
textarea,select{width:100%;padding:12px;border-radius:12px;border:2px solid #dfe6e9;margin-top:5px;font-size:14px}
textarea{height:110px;resize:none}
.row{display:flex;gap:10px;margin-top:15px}
button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:600;cursor:pointer}
.btn-speak{background:#6C5CE7;color:white}
.btn-stop{background:#dfe6e9;color:#2d3436}
.footer{text-align:center;margin-top:15px;font-size:11px;color:#b2bec3}
.status{text-align:center;margin-top:10px;font-size:12px;color:#6C5CE7;height:18px}
</style>
</head>
<body>
<div class="card">
<h1>🎙️ B2 Voice Buddy</h1>
<p class="sub">Arbab's Personal AI Voice Assistant</p>
<label>✍️ Type Text</label>
<textarea id="text" placeholder="Hello Arbab! How are you today?"></textarea>
<label>🌐 Language</label>
<select id="lang">
<option value="en-US">English (US)</option>
<option value="ur-PK">Urdu (Pakistan)</option>
<option value="en-GB">English (UK)</option>
<option value="ar-SA">Arabic</option>
<option value="hi-IN">Hindi</option>
</select>
<label>🔊 Speed</label>
<select id="speed">
<option value="0.8">Slow</option>
<option value="1" selected>Normal</option>
<option value="1.3">Fast</option>
</select>
<div class="row">
<button class="btn-speak" onclick="speak()">▶️ Speak</button>
<button class="btn-stop" onclick="stop()">⏹️ Stop</button>
</div>
<div class="status" id="status"></div>
<div class="footer">Made with ❤️ by Arbab - 2026<br>Install: Chrome ⋮ → Add to Home Screen</div>
</div>
<script>
function speak(){
  const text=document.getElementById('text').value.trim();
  const lang=document.getElementById('lang').value;
  const speed=parseFloat(document.getElementById('speed').value);
  const status=document.getElementById('status');
  if(!text){status.innerText="⚠️ Please type something!";return;}
  window.speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=speed;
  u.onstart=()=>status.innerText="🔊 Speaking...";
  u.onend=()=>status.innerText="✅ Done! Mashallah";
  window.speechSynthesis.speak(u);
}
function stop(){window.speechSynthesis.cancel();document.getElementById('status').innerText="⏹️ Stopped";}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
